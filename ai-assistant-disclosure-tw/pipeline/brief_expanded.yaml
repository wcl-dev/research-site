key_terms:
  - B2A2C
  - agent-legible / machine-readable
  - GEO for public good / generative engine optimization
  - ClaimReview / schema.org
  - llms.txt
  - answer engine / AI Overviews / Perplexity
  - data void / 資料真空
  - censorship-by-proxy / 代理審查
  - shared reality / 共同真實 / public sphere
  - opt-in vs opt-out
  - Cofacts / 台灣事實查核中心 / MyGoPen
  - 人工智慧基本法 / EU AI Act / DSA

exclusion_terms:
  - 傳統 SEO 排名教學
  - 純行銷 / vendor 產品宣傳
  - AI 倫理泛論(無治理機制或可讀化操作)
  - 著作權分潤談判細節(屬 media-ai-protocols-tw)
  - 身份條件式拒答重跑(屬 llm-user-side-bias 問題面)
  - AGI/超智能思辨

source_priorities:
  must_include:
    # P 錨點一手
    - Waight et al. Nature 2026 全文/摘要 + state-media-influence-llm.github.io
    - Meta Oversight Board 2026-07-16 report 全文
    - HKS Misinformation Review 2025 data-voids/grooming
    # T 標準與機制
    - schema.org ClaimReview 官方規格
    - llms.txt 官方規格/採用現況
    - Reuters Institute / Oxford Internet Institute 答案引擎/GEO 報告
    - NewsGuard / American Sunlight Project Pravda network 稽核
    # F 台灣查核
    - Cofacts / g0v 開放資料與 API 文件
    - 台灣事實查核中心 官方(是否輸出 ClaimReview)
    - IFCN ClaimReview 生態文件
    # D 對話式
    - Costello et al. Science 2024 (DebunkBot)
    - arxiv 2510.01537 (no lasting discernment 反證)
    # G 治理
    - moda 《人工智慧基本法》全文 + 風險分級草案
    - NSTC 生成式 AI 參考指引
    - EU AI Act (transparency/Art 50 標示)
    - DSA Code of Practice on Disinformation
    # 台灣認知環境社群
    - IORG / Doublethink Lab AI 相關研究
  deprioritize:
