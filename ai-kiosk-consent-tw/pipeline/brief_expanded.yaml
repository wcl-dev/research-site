# G4 audit #16 — counter_framings 全短關鍵字、可 substring-match
# 仍補上 counter_framing_keywords map 以利 Synthesizer 跨指
counter_framing_keywords:
  inference_not_collection: ["inference 不算", "不算蒐集", "不算個資", "非個資"]
  no_storage: ["不存", "立即刪除", "不留存", "本機處理"]
  no_identification: ["不識別個人", "不對應個人", "匿名"]
  implied_consent: ["公告即同意", "默示同意", "使用即同意"]

# ─────────────────────────────────────────────────────────────
# Exclusion terms
# ─────────────────────────────────────────────────────────────
exclusion_terms:
  - "海關 人臉辨識"           # 機場海關不是餐飲零售
  - "邊境 人臉辨識"
  - "校園 人臉辨識"           # 教育場景
  - "監視器 CCTV 通用"        # 跟 kiosk 點餐 inference 無關
  - "深度偽造 deepfake"       # 攻擊角度非同意機制
  - "人臉辨識原理 教學"       # SEO 衛教文

