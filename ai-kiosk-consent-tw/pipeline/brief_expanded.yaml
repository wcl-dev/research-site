    - "WiXtar 星益欣"
    - "金色三麥 LE BLE D'OR"
    - "雙月食品社"
    - "司法院裁判書系統"
    - "EU AI Act / GDPR primary doc"

  deprioritize:
    - "純技術 SEO 教學文 (人臉辨識原理 1-2-3)"
    - "廠商純行銷頁無實證資料"
    - "深度偽造 / 資安攻擊角度的生物辨識討論"
