# sources.yaml — ai-kiosk-consent-tw
#
# Source library for Collector. Cherry-picked from sources_seed.yaml
# (2 entries) + 18 fresh entries specific to this brief.
# `seen_in` field dropped from seed entries per §7a protocol.
#
# Coverage:
#   - 監管/政府 (5): PDPC, 法務部 (via taiwan-legal-db MCP), 消保處, moda, 公平會
#   - 法律/裁判 (2): taiwan-legal-db MCP (regulations + judgments)
#   - 業者/部署方 (5): WiXtar, 金色三麥, 雙月食品社, Berry AI, 銓幻元
#   - 品質媒體 (5): iThome, TechNews, 數位時代, CIO Taiwan, foodnext, 中央社
#   - 消費者組織 (1): 消基會
#   - 國際對照 (3): EDPB/GDPR primary doc, BIPA primary doc, EU AI Act
#   - 國際學術 (1): ACM Digital Library

sources:
  # ─── 監管 / 政府 (Taiwan) ───
  - name: 個人資料保護委員會籌備處 (PDPC)
    type: regulator
    content_style: primary_doc
    focus: 個資法主管機關;函釋、解釋、公告;2023/12/05 籌備處成立,2025/11 修法後將設正式委員會
    fetch: scrape
    url: https://www.pdpc.gov.tw/
    homepage: https://www.pdpc.gov.tw/
    verify: true
    verified_date: "2026-05-26"
    notes: "本案核心 must_include source;對人臉/生物特徵的函釋是 Q4 法律 framing 拆解的關鍵"

  - name: 全國法規資料庫 (法務部)
    type: regulator
    content_style: mcp_portal
    focus: 個資法、施行細則、相關判決;via taiwan-legal-db MCP server
    fetch: mcp
    verify: true
    verified_date: "2026-05-26"
    mcp_server: taiwan-legal-db
    mcp_tools:
      - search_regulations
      - query_regulation
      - get_pcode

  - name: 司法院裁判書系統 (via taiwan-legal-db MCP)
    type: regulator
    content_style: mcp_portal
    focus: 個資法、生物特徵、消費場所相關判決
    fetch: mcp
    verify: true
    verified_date: "2026-05-26"
    mcp_server: taiwan-legal-db
    mcp_tools:
      - search_judgments
      - get_judgment

  - name: 行政院消費者保護處
    type: regulator
    content_style: primary_doc
    focus: 消費者申訴統計、消費爭議調處、餐飲場所消費者權益
    fetch: scrape
    url: https://cpc.ey.gov.tw/
    verify: true
    verified_date: "2026-05-26"

  - name: 數位發展部 moda (Taiwan)
    type: regulator
    content_style: publication_index
    focus: 數位發展政策、AI 治理政策、平台監管;cherry-picked from sources_seed
    fetch: scrape
    url: https://moda.gov.tw/
    homepage: https://moda.gov.tw/
    verify: true
    verified_date: "2026-05-26"

  - name: 公平會
    type: gov
    content_style: primary_doc
    focus: 反不公平競爭;若餐廳同意機制構成不實揭露可涉公平法;cherry-picked from sources_seed
    fetch: scrape
    url: https://www.ftc.gov.tw/internet/main/index.aspx
    verify: true
    verified_date: "2026-05-26"

  # ─── 業者 / 部署方 (Taiwan F&B AI Kiosk 廠商與部署案場) ───
