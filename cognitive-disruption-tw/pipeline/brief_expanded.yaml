keyword_expansions:
  motive_frames: [政治攻擊, 影響力操作, 認知作戰, FIMI, 詐騙, 內容農場, 廣告變現, financially-motivated, influence operation, scam, content farm, profit-driven, propaganda]
  shared_infrastructure: [批量帳號, AI 生成人設, cloaking, 偽裝, 跨語言, 帳號農場, account farm, bulk creation, synthetic persona, infrastructure reuse, GAN profile, intermediary, bulletproof hosting, sockpuppet, repurposed asset]
  ai_slop: [AI slop, generative AI, AI-generated, synthetic content, LLM spam, scaled content, deepfake, synthetic media]
  harm_model: [epistemic security, information disorder, cognitive infrastructure, 認知共有財, trust erosion, firehose of falsehood, flooding, liar's dividend, information pollution, epistemic commons, censorship through noise, 資訊環境劣化]
  force_multiplier: [audience capture, prebunking, trust baseline, spillover, force multiplier, priming, pre-positioning, sleeper account, minimal effects]
  detection_blindspots: [CIB detection, content moderation, financial trail, digital asset fingerprint, detection evasion, adversarial, blind spot, behavioral indicator]
  cross_domain_interfaces: [DISARM, STIX, TAXII, IMS, EU DisinfoLab, EEAS, ABCDE, SCOTCH, BEND, threat sharing, attribution, liability, sanctions, STIX bundle]
  cases_tw: [養生, FB 短連結, YouTube 協同頻道, 台灣事實查核, 認知作戰台灣, IORG, Doublethink Lab]

# G4 — counter-framings the Drafter MUST seek evidence for, to avoid one-sided thesis
counter_framing_keywords:
  just_spam: [低品質, spam, 垃圾內容, 無意圖, 演算法副產物, engagement farming, clickbait]
  just_profit: [純獲利, 廣告分潤, 商業模式, ad arbitrage, monetization]
  no_measurable_effect: [無效果, minimal effects, 說服力有限, no measurable impact, backfire, overstated]
  shared_vendor_not_actor: [各自獨立, 不同行為者, coincidence, shared vendor, shared playbook, multi-tenant]

exclusion_terms: [SEO 教學, 純行銷文, AI 倫理泛論, 地緣政治評論, 單則查核]

review:
  mode: single
  fidelity_level: high
