project: defense-cut-supply-chain-pivot-tw
version: v2
year_from: 2015
languages: [zh-TW, en, zh-CN]

# 雙鏈 framing + comparative 對比結構
brief_type:
  intent: comparative
  horizon: current

# ──────────────────────────────────────────────────────────────
# I3 — Concept ontology (A 工具機 / B 無人機相關製造 / E 買方市場)
# research_focus = (A ∪ B) — 對比鏈
# pathways(P_west / P_south)、外銷對沖等放 brief.md prose，不放 ontology
# ──────────────────────────────────────────────────────────────
concept_ontology:
  - id: A
    label: "工具機產業（上游母機）"
    definition: >-
      製造精密零組件用的工作母機產業，包括 CNC 車床、銑床、五軸加工中心、
      磨床、線切割機、滾齒機等。技術應用跨多產業（航太、汽車、3C、國防），
      不局限於無人機。
    examples_in:
      - "友嘉集團（Fair Friend Group）"
      - "台中精機（Victor Taichung）"
      - "東台精機（Tongtai）"
      - "上銀科技（HIWIN，2049.TW）"
      - "銀泰科技（PMI）"
      - "程泰機械（Goodway）"
      - "瀧澤科技（Takisawa Taiwan）"
      - "台灣麗馳（Litz Hitech）"
      - "大立機器"
      - "亞德客集團（Airtac）"
      - "百德機械"
    examples_out:
      - "工具機加工出來的零組件本身（屬於 B 範疇）"
      - "純消費電子組裝（不是工作母機）"

  - id: B
    label: "無人機相關製造業（中下游：整機 + 零組件）"
    definition: >-
      用工具機加工的無人機相關零組件廠 + 整機廠。涵蓋軍規（NCSIST 自研）
      + 軍用商規（民間廠商接國防訂單但採用 COTS 商用底層技術）。
    examples_in:
      - "中山科學研究院（NCSIST，國家隊核心，純軍規）"
      - "中光電智能機器人（佳世達 / 中光電；微型 + 監偵）"
      - "長榮航太（2645.TW；艦載監偵）"
      - "智飛科技（VTOL 混合構型）"
      - "神通資訊（5206.TW；微型目獲 / 戰術）"
      - "漢翔航空（2634.TW；複材 + 量產）"
      - "雷虎科技（8033.TW；軍用商規 + 無人艇）"
      - "經緯航太（系統設計）"
      - "飛鴻、台希創、新樂飛"
      - "碳基科技（碳纖維機體 / 無人艇複材）"
      - "亞洲光學（光學酬載 — 熱顯像 / 夜視）"
      - "建準（散熱風扇）"
      - "鈺創（AI 視覺 / 記憶體）"
    examples_out:
      - "DJI 等純消費級無人機（純商用，不在範圍）"
      - "純空拍機 / 農業噴灑無人機（除非作為對比 baseline）"

  - id: E
    label: "無人機買方市場（最終客戶 / 外銷對手方）"
    definition: >-
      採購軍規 / 軍用商規無人機的國家或機構。本研究中作為「外銷對沖」軸的對手方。
    examples_in:
      - "美國（DoD / FMS）"
      - "波蘭（2025 進口台灣無人機數量超過美國）"
      - "法國（Parrot 合作）"
      - "日本"
      - "印度"
      - "捷克、波蘭、烏克蘭"
      - "以色列"
      - "台灣國防部（在軍購未被砍的版本中）"
    examples_out:
      - "中國（不是台灣無人機買家，但是 P_west 產能轉移目的地）"
      - "東南亞（不是主要買家，是 P_south 產能轉移目的地）"

research_focus: "A∪B"

# ──────────────────────────────────────────────────────────────
# Queries — 5 大角度
# ──────────────────────────────────────────────────────────────
queries:
  # ── 角度 1：軍購砍案事實基底（Q1）──
  - text: "台灣 國防特別預算 1.25兆 7800億 4700億 砍 立法院 2026"
  - text: "保衛國家安全 強化不對稱戰力 採購特別條例 三讀 藍白"
  - text: "3350億 無人載具 21萬架 1320艘 無人艇 軍購 刪除"
  - text: "本土軍工產業鏈 3000億 委製 預算 砍光"

  # ── 角度 2：工具機西進與十五五（Q3 / A）──
  - text: "台灣 工具機 西進 中國 設廠 友嘉 上銀 台中精機"
    concept_target: A
  - text: "Taiwan machine tool industry China investment relocation"
    concept_target: A
  - text: "中國 十五五規劃 工具機 進口替代 國產化"
    concept_target: A
  - text: "台灣 精密機械 中國 關稅 成本 競爭"
    concept_target: A
  - text: "Taiwanese CNC machine tool manufacturers mainland China factory"
    concept_target: A

  # ── 角度 3：無人機產業外銷與非紅供應鏈（Q2 / B / E）──
  - text: "台灣 無人機 外銷 21倍 波蘭 歐洲 非紅供應鏈 2025"
    concept_target: B
  - text: "Taiwan drone export non-China supply chain Poland Europe 2025"
    concept_target: B
  - text: "嘉義 民雄航太園區 無人機 國家隊 中光電 雷虎"
    concept_target: B
  - text: "亞洲無人機AI創新應用研發中心 廠商進駐 2025"
    concept_target: B
  - text: "DSET 台灣 無人機 信任 民主供應夥伴 不對稱作戰"
    concept_target: B

  # ── 角度 4：長臂管轄 + 非紅供應鏈鎖出機制（Q5）──
  - text: "中國 反外國制裁法 台商 長臂管轄 域外管轄"
  - text: "US BIS Entity List Taiwan machine tool export control"
  - text: "Wassenaar Arrangement dual-use export control five-axis machining"
  - text: "EAR Entity List Taiwanese company subsidiary China"
  - text: "台灣 國防供應鏈 紅供應鏈 美國 出口管制 鎖出"

  # ── 角度 5：學術 baseline + 國際比較（Q3 / Q6）──
  - text: "Taiwan defense industry domestic production cross-strait industrial relocation"
  - text: "cross-strait industrial integration semiconductor defense supply chain Taiwan"
  - text: "South Korea Israel domestic defense production China relationship"
  - text: "friend-shoring near-shoring defense supply chain Indo-Pacific"
  - text: "industrial pivot Vietnam Indonesia Taiwanese investment 2020 2025"

