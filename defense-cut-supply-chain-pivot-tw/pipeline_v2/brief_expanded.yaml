# ──────────────────────────────────────────────────────────────
# G4 / audit #16 — counter_framings 語意展開
# 操作員 2026-05-19 retrofit (Cluster C 落地後)：原 counter_framings 是 sentence-length，
# validate_gate.check_balance_asymmetry / Gatekeeper G4 substring match 永遠 false negative。
# 這份 map 提供短關鍵字讓 balance check 真的有用。
# ──────────────────────────────────────────────────────────────
counter_framing_keywords:
  outbound_hedge: ["外銷", "整機外銷", "export", "出口"]
  biz_rationality: ["商業合理", "成本", "供應鏈成本", "市場規模"]
  scale_not_jurisdiction: ["中國市場", "市場規模", "non-jurisdictional"]
  tool_drone_link_imagined: ["連結是想像", "推論過度", "缺乏直接證據"]
  southeast_hedge: ["東南亞", "南向", "ASEAN", "越南", "印度"]
  budget_procedural: ["程序", "預算審議", "三讀", "程序問題"]

