# ─────────────────────────────────────────────────────────────
# Exclusion
# ─────────────────────────────────────────────────────────────
exclusion_terms:
  - "參與式預算"             # 不同機制,不同門檻/單位
  - "公民投票 公投 連署"      # 不同法律門檻,只作對照不混主資料
  - "數位轉型 政策宣導"        # 開放政府宣傳文
  - "We the People 美國結論直接套用"
  - "平台 UI 介面 教學"        # 純 UX,除非觸及門檻機制

# ─────────────────────────────────────────────────────────────
# Source priorities
# ─────────────────────────────────────────────────────────────
source_priorities:
  must_include:
    - name: "O'Brien & Kasianenko 2026 IPSR 10.1177/01925121261442380"
      fetch_fallback: secondary_citation_acceptable
    - "Join 提點子開放資料 dataset 58036 / join.gov.tw toOpenData"
    - "國家發展委員會 公共政策網路參與平臺 實施要點/成效報告"

  deprioritize:
    - "開放政府/數位轉型純政策宣導頁"
    - "單一爆紅提案的軼事報導(須回母體)"
    - "平台 UI 操作教學"

