  counter_framings:
    - 詐騙多發生在真平台假賣場
    - 電話簡訊才是詐騙主力
    - 攔阻量不等於受害佔比
    - 假投資多為純 LINE 群組

# G4 / audit #16 — counter_framings 為句子型, 提供短關鍵字供 substring match
counter_framing_keywords:
  real_platform_not_fake_site: ["真平台", "蝦皮", "Marketplace", "假賣場", "假帳號", "平台假"]
  voice_sms_primary: ["電話詐騙", "語音", "簡訊詐騙", "猜猜我是誰", "假檢警", "解除分期"]
  supply_not_demand: ["攔阻", "下架", "停止解析", "通報量", "供給端"]
  line_group_variant: ["LINE 群組", "投資群組", "喊單", "通訊軟體", "加 LINE"]

# audit #1 — 資料持有機構分層;Collector Track 4 portal fan-out 依宣告順序展開
actor_layers:
  gov_data_holders:
    - 內政部警政署刑事警察局 165
    - 內政部警政署 165 打詐儀表板
    - 數位發展部數位產業署
    - 法務部調查局
    - 財政部
    - 金融監督管理委員會
  infrastructure:
    - TWNIC 台灣網路資訊中心
    - TWCERT/CC
  industry:
    - 趨勢科技 Trend Micro
    - Whoscall (Gogolook 走著瞧股份有限公司)
    - 台灣數位信任協會
  platform:
    - Meta
    - LINE
    - Google

exclusion_terms:
  - accounting fraud
  - financial statement fraud
  - healthcare fraud
  - insurance fraud
  - credit card fraud detection algorithm
  - astrophysics

source_priorities:
  must_include:
    - 165 打詐儀表板 (內政部警政署)
    - 內政部警政署刑事警察局
    - name: 數位發展部數位產業署 網路詐騙通報查詢網
      fetch_fallback: secondary_citation_acceptable
    - name: TWNIC DNS RPZ 透明度報告
      fetch_fallback: secondary_citation_acceptable
    - Whoscall / Gogolook 年度防詐報告
    - name: 趨勢科技 資安報告與防詐調查
      fetch_fallback: secondary_citation_acceptable
    - 台灣數位信任協會
    - name: 法務部調查局
      fetch_fallback: skip_with_flag
  deprioritize:
    - 法律事務所 / 資安廠商 SEO 衛教部落格
    - 純網路聲量排行 (KEYPO / 網路溫度計)
    - 防詐產品行銷頁與產品發表稿
    - 單一受害者現身說法
    - 不含台灣量化數據的國際 phishing 概論

seek_direct:
  - https://165dashboard.tw/
  - https://rpz.twnic.tw/
  - https://fraudbuster.digiat.org.tw/accessibility/statistics/chart
  - https://dtatw.org/news/
  - https://moda.gov.tw/ADI/news/latest-news

review:
  mode: multi_model
  fidelity_level: high
