    concept_target: A
  - text: "LINE 訊息查證 2019 上線 台灣事實查核中心 合作"
    concept_target: A
  - text: "Facebook 台灣 事實查核 合作 宣布 2019"
    concept_target: A
  # B — 機制與撤資
  - text: "Meta fact-checker rating similar content matching machine learning transparency"
    concept_target: B
  - text: "Meta ends fact-checking program international partners 2025 2026"
    concept_target: B
  - text: "台灣事實查核中心 Meta 合約 授權收入 2026"
    concept_target: B
  - text: "IFCN State of Fact-Checkers 2025 revenue Meta dependence"
    concept_target: B
  - text: "fact-checkers open letter Zuckerberg signatories list"
    concept_target: B
  # C — 能動性
  - text: "台灣事實查核中心 財務 徵信 2025 2026"
    concept_target: C
  - text: "MyGoPen 內容授權 資訊素養 營運"
    concept_target: C
  - text: "Cofacts 開放資料 授權 fork Thailand"
    concept_target: C
  - text: "fact-checking organizations diversification survival strategies after Meta 2025"
    concept_target: C
  - text: "數位發展部 打詐 事實查核 合作 民間"
    concept_target: C
  - text: "misinformation label freshness decay local fact-checkers platform need"
    concept_target: C
  # D — 背景補缺（seeds 已有主體，只補台灣端變動）
