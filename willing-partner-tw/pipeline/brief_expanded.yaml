project: willing-partner-tw
version: v1
year_from: 2016
languages: [en, zh-TW]

brief_type:
  intent: argument-audit    # 論證型（say-do gap）但以審計紀律執行；三幕敘事、對照對為承重牆
  horizon: current          # 核心事件 2024–2026 進行式；2016+ 僅承諾語料基期

# ─────────────────────────────────────────────────────────────
# I3 — Concept ontology（三幕 + 背景）
# ─────────────────────────────────────────────────────────────
concept_ontology:
  - id: A
    label: "承諾語料（進場期 willing-partner 語域）"
    definition: >-
      平台在合作關係建立期（2016–2021）對事實查核夥伴的公開承諾與依賴表述，
      逐字、具日期、可溯源到一手出處。含退場語料（2025）作為對照的另一極。
    examples_in:
      - "Meta newsroom 2016-12 3PFC 啟動公告"
      - "Tessa Lyons 2018-06 / 2018-09 'we rely on fact-checkers' 系列"
      - "Facebook 台灣 2020-03 MyGoPen 合作宣言（陳奕儒）"
      - "Zuckerberg / Joel Kaplan 2025-01 退場聲明（對照極）"
      - "LINE 訊息查證 2019 上線公告"
    examples_out:
      - "平台高管泛論 misinformation 的演講（無夥伴承諾內容）"
      - "無法溯源的流傳語錄"

  - id: B
    label: "萃取與撤資行為（做一套）"
    definition: >-
      夥伴產出進入平台系統的機制（平台自述措辭），與資源/支持被單方終止的行為紀錄。
      每項標「平台留下什麼、夥伴失去什麼」。措辭紀律：比對基準/預測地面真值，
      「training data」僅限直接引文。
    examples_in:
      - "fact-checker rating 作為相似內容比對基準（Meta transparency center）"
      - "2025-01 美國 3PFC 終止與 Community Notes 替代"
      - "CrowdTangle 2024-08 關閉 / Meta Content Library 准入限制"
      - "X/Twitter API 2023 收費牆"
      - "TFC Meta 合約 2026-01 到期危機（日經口徑）"
      - "OpenAI 紅隊 prompt→DALL-E3 分類器 / Anthropic Constitutional Classifiers（同構旁證）"
    examples_out:
      - "平台一般性裁員或產品下線（與查核夥伴無關）"
      - "動機歸因（『因為拿夠了』）——不可證，禁入 B"
      - "跨主體對照（Meta 的承諾 × OpenAI/Anthropic 的行為）——移花接木，絕對禁止；lab 素材僅限機制同構、須自成一節"

  - id: C
    label: "夥伴能動性與槓桿（silver lining）"
    definition: >-
      夥伴在撤資變局中的主動應對、平台拿不走的資產、以及對平台的殘餘槓桿。
      只用夥伴自己的公開陳述與可查行為，不代言、不悲情化。
    examples_in:
      - "MyGoPen 商模轉身（內容授權＋教育專案、不收公眾捐款）"
      - "Cofacts 開放策略（MIT code / HF dataset / 泰國 fork）"
      - "政府反詐需求管道（數位部/刑事局/iWIN/LINE 反詐遊戲聯盟）"
      - "TFC 2020 大選改變平台執法的紀錄（Li & Chen 2025）"
      - "94% 平台問責立法民意（台灣韌性社會研究中心 2026-05）"
      - "在地感測知識過期論（label freshness——需找支撐或標為本研究論證）"
    examples_out:
      - "夥伴受害者敘事（違反 partner-safe）"
      - "EU DSA 全球一致論（已查死，禁用）"

  - id: D
    label: "境外資金生態（背景 only）"
    definition: >-
      同一批夥伴的非平台資金來源地圖（美國民主資金），僅服務「撤資後替代財源多薄」
      與「上下游雙黑箱」一句脈絡。不展開成軸線。
    examples_in:
      - "OSF grants DB 台灣受贈紀錄"
      - "OTF 三筆台灣支持（OCF/DTL/fellowship）"
      - "NED 資料庫下架與匿名化（關燈梯度）"
      - "TFC 捐款徵信（OSF/Meedan/X 2023）"
    examples_out:
      - "美國民主資金政策史（另一篇研究）"
      - "台灣政府資金（TFD/遠景——方向相反，只防混淆）"

research_focus: "A×B gap 為核心，C 為對位聲部；D 背景"

# ─────────────────────────────────────────────────────────────
# Queries
# ─────────────────────────────────────────────────────────────
