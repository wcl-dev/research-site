  counter_framings:
    - fact-checking as censorship        # Meta 2025 官方框架，必須如實呈現
    - political rebalancing explanation  # 退場的政治解釋（對等競爭解釋，不可壓下）
    - fair market transaction            # 查核有酬＝市場交易非萃取
    - commons contribution not extraction  # Cofacts 自選開放
    - durable open-source giveback       # ThreatExchange/HMA BSD（鋼人存活論證）
    - platform-funded capacity building  # Google.org 媒體素養（留存人力資本）
    - fact-checker bias studies          # 任何實證查核偏誤研究都必須正面處理

exclusion_terms:
  - fact-checking in education assessment   # 教育測驗文獻污染
  - "'label' as ML-classification-only literature"
  - blockchain fact-checking startups

